[package]
name = "sea-g2p-rs"
version = "0.7.16"
edition = "2021"

[lib]
name = "sea_g2p_rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
python = ["pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", optional = true, features = ["abi3-py310", "generate-import-lib"] }
regex = "1.10"
fancy-regex = "0.13"
once_cell = "1.19"
memmap2 = "0.9"
rayon = "1.10"
unicode-normalization = "0.1"
