name: Windows release

on:
  workflow_dispatch:
    inputs:
      smoke_build_run:
        description: 'Diagnose an existing Windows-native-smoke artifact; never package or release it'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install Vulkan SDK and Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe' -OutFile $installer
          $install = Start-Process $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($install.ExitCode)" }
          $sdk = 'C:\VulkanSDK\1.4.363.0'
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw 'Vulkan SDK not found.' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Restore unchanged runtime models and voices
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.5 --repo $env:GITHUB_REPOSITORY --pattern RaceEngineer-1.0.5-windows-x64.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed.' }
          $archive = Join-Path $env:RUNNER_TEMP 'RaceEngineer-1.0.5-windows-x64.zip'
          $expected = '127d729719ac8aeb1cb7950b76d3eb82c7df0941dcb85ad7b4eee5225bb2847e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Runtime archive checksum mismatch.'
          }
          $runtime = Join-Path $env:RUNNER_TEMP 'runtime-1.0.5'
          Expand-Archive $archive -DestinationPath $runtime
          Copy-Item "$runtime\bin\models" .\models -Recurse
          Copy-Item "$runtime\bin\voices" .\voices -Recurse
          "VC_REDIST_X64=$runtime\vc_redist.x64.exe" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        if: inputs.smoke_build_run != ''
        with:
          name: Windows-native-smoke
          path: build-production
          run-id: ${{ inputs.smoke_build_run }}
          github-token: ${{ github.token }}
      - name: Build and test Windows x64
        if: inputs.smoke_build_run == ''
        shell: pwsh
        run: |
          .\production\scripts\build-release.ps1 -QtPrefix $env:QT_ROOT_DIR -EnableLtcg
      - name: Configure software Vulkan for the GPU-less smoke runner
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\*\vk_swiftshader_icd.json",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\*\vk_swiftshader_icd.json",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\vk_swiftshader_icd.json"
          )
          $icd = Get-ChildItem $candidates -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $icd) { throw 'SwiftShader Vulkan ICD not found on the smoke runner.' }
          $definition = Get-Content $icd.FullName -Raw | ConvertFrom-Json
          $driver = Join-Path $icd.DirectoryName $definition.ICD.library_path
          if (-not (Test-Path $driver)) { throw 'SwiftShader Vulkan DLL is missing.' }
          # Elevated Vulkan processes can ignore driver environment overrides.
          $registry = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          New-Item $registry -Force | Out-Null
          New-ItemProperty $registry -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          $env:VK_DRIVER_FILES = $icd.FullName
          $env:VK_ICD_FILENAMES = $icd.FullName
          "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV
          Write-Host "Smoke Vulkan ICD: $($icd.FullName); API $($definition.ICD.api_version)"
      - name: Verify built QML and setup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          New-Item build -ItemType Directory -Force | Out-Null
          $versionCheck = Start-Process .\build-production\RaceEngineer.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput build\native-setup-version.txt
          Get-Content build\native-setup-version.txt
          if ($versionCheck.ExitCode -ne 0) { throw "Built executable version check failed: $($versionCheck.ExitCode)" }
          .\production\scripts\verify-setup-ui.ps1 -ExecutablePath .\build-production\RaceEngineer.exe -LogPrefix native
      - name: Package and verify
        if: inputs.smoke_build_run == ''
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(RaceEngineer VERSION (\d+\.\d+\.\d+)') { throw 'Project version missing.' }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and application version differ.'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          .\production\scripts\package-portable.ps1 -Version $version -QtPrefix $env:QT_ROOT_DIR
          .\production\scripts\verify-release.ps1 -PackageDirectory ".\production\dist\RaceEngineer-$version"
          python tests\ui\pe_icon_audit.py --icon assets\final_icon.ico --exe "production\dist\RaceEngineer-$version\bin\RaceEngineer.exe" --exe "production\dist\RaceEngineer-$version-Setup.exe" --output build\native-setup-icons.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable or installer logo differs from the new ICO.' }
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          .\production\scripts\verify-setup-ui.ps1 -ExecutablePath ".\production\dist\RaceEngineer-$version\bin\RaceEngineer.exe" -LogPrefix packaged
          Get-ChildItem production\dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content production\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: inputs.smoke_build_run == ''
        with:
          name: RaceEngineer-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            production/dist/*.exe
            production/dist/*.zip
            production/dist/SHA256SUMS.txt
            production/dist/RaceEngineer-*/release-manifest.json
            build/setup-ui-check/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-QML-diagnostics
          path: |
            build/*setup-*.txt
            build/*setup-*.json
            build/setup-ui-check/*.png
            production/dist/RaceEngineer-*/release-manifest.json
            production/dist/RaceEngineer-*/bin/RaceEngineer.exe
            production/dist/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: (failure() || cancelled()) && inputs.smoke_build_run == ''
        with:
          name: Windows-native-smoke
          path: |
            build-production/*.exe
            build-production/*.dll
            build-production/*.bin
            build-production/*.mp3
            build-production/audio/
            build-production/qml/
            build-production/platforms/
            build-production/imageformats/
            build-production/multimedia/
            build-production/tls/
            build-production/networkinformation/
          if-no-files-found: ignore
          retention-days: 3
      - name: Prepare verified draft release
        if: startsWith(github.ref, 'refs/tags/') && inputs.smoke_build_run == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content "docs/releases/$env:GITHUB_REF_NAME.md" -Raw
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $source = "Source for these binaries: [commit $short](https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA)."
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($notes + "`n" + $source + "`n") | Set-Content $notesPath
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "RaceEngineer $env:GITHUB_REF_NAME" --notes-file $notesPath "production/dist/RaceEngineer-$env:RELEASE_VERSION-Setup.exe" "production/dist/RaceEngineer-$env:RELEASE_VERSION-windows-x64.zip" production/dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
